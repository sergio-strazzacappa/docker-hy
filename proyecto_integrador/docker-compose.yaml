services:
  backend:
    image: backend:v1
    build: ./example-backend
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
        #expose:
        #- "8080"

  frontend:
    image: frontend:v1
    build: ./example-frontend
      #expose:
      #- "5001"

  db:
    image: postgres
    restart: unless-stopped
    container_name: db
    volumes:
      - ./db:/var/lib/postgresql/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres

  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 8000:80

  redis:
    image: redis
